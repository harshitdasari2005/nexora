# Nexora — CI pipeline
# Architecture reference: ROADMAP.md §7 Wave A (tooling/ci), ENGINEERING_PLAYBOOK.md §8.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run the full gate on the CI baseline (22) and the lowest version
        # `engines.node` claims to support (20), so a 20-incompatible API
        # never lands green.
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests
        run: pnpm test
      - name: Secret scan
        run: pnpm scan:secrets

  boot:
    name: Boot check (real infra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure (Postgres)
        run: |
          cp .env.example .env
          # Postgres is the only hard dependency for API boot, so only it is
          # started: pulling the optional services (e.g. the minio/minio image,
          # no longer published on Docker Hub) must not fail the boot check.
          docker compose -f infrastructure/compose/docker-compose.yml up -d postgres
          for i in $(seq 1 30); do
            if docker exec nexora-postgres pg_isready -U nexora -d nexora >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done

      - name: Build
        run: pnpm build

      - name: Boot the API and probe /api/health
        run: |
          DATABASE_AUTO_MIGRATE=true node apps/api/dist/src/server.js &
          API_PID=$!
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://localhost:3001/api/health | grep -q '"status":"ok"'; then
              echo "API healthy"; ok=1; break
            fi
            sleep 2
          done
          kill "$API_PID" 2>/dev/null || true
          test "$ok" = "1"

      - name: Tear down infrastructure
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v
