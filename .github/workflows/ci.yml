# Nexora — CI pipeline (placeholder scaffold)
# Architecture reference: ROADMAP.md §7 Wave A (tooling/ci), ENGINEERING_PLAYBOOK.md §8.
#
# NOTE: this workflow is a placeholder. It becomes enforceable once the first
# packages are scaffolded and pnpm-lock.yaml is committed (Roadmap S1–S2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stabilization (2026-08): baseline quality gates enabled — all green
      # locally on the known-good baseline.
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests
        run: pnpm test
      # TODO(S1): contract tests are already covered by `pnpm test`
      # (@nexora/contracts runs its own suite); a standalone contract-test
      # runner lands with tooling/ci. Security scan (audit-ci) is pending
      # dependency ratification (ENGINEERING_PLAYBOOK.md §8.3).
      # - name: Security scan (secrets + dependencies)
      #   run: pnpm exec audit-ci --high
