# Local MinIO port override (NOT part of the standard stack).
#
# Host port 9000 is occupied by an unrelated long-running dev process
# (`apps/frappe/socketio.js`), so the compose MinIO cannot bind 9000.
# This override maps the S3 API to 9002 and the console to 9003, and the
# matching S3_* values live in `.env` (S3_PORT=9002). Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.minio-ports.yml up -d minio
name: nexora-dev

services:
  minio:
    ports: !override
      - '9002:9000' # S3 API (host 9000 is taken by an unrelated dev server)
      - '9003:9001' # Console
