# Nexora — local development infrastructure (placeholder services)
# Architecture reference: ROADMAP.md §3 TDR (3.4, 3.5, 3.6, 3.10), BKD §6 infrastructure services.
#
# The application container is intentionally NOT declared here yet:
# ROADMAP.md §7 Wave A declares infra only; the app node arrives with Phase 1.
# Event backbone (Kafka-compatible) and search/vector planes are added in
# Phase 1–2 per TDR 3.7/3.8/3.9.

name: nexora-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
    # Host port 5433: a locally installed Postgres often occupies 5432, which
    # would shadow this container. 5433 is the conventional alternate.
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-nexora_dev_redis}']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-nexora_dev_redis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nexora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_dev_minio}
    # Host ports follow S3_PORT in the repo-root .env (pnpm dev:local passes it
    # through as NEXORA_MINIO_PORT), so the API and MinIO always agree.
    ports:
      - '${NEXORA_MINIO_PORT:-9000}:9000' # S3 API
      - '${NEXORA_MINIO_CONSOLE_PORT:-9001}:9001' # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexora-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-nexora_dev_keycloak}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      # Realm import (infrastructure/keycloak/realm-nexora.json).
      - ../keycloak:/opt/keycloak/data/import:ro
    # The Keycloak image ships no curl/wget, so the check uses bash /dev/tcp
    # against the readiness endpoint (HTTP 200 = healthy).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET
          /health/ready HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && head -c
          2000 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- Placeholders added in later phases (TDR 3.7 / 3.8 / 3.9) ---
  # event-broker: Kafka-compatible backbone (Phase 1, S6)
  # opensearch: search + knowledge indexes (Phase 1, S8)
  # app: modular monolith node (Phase 1, S4+)

volumes:
  postgres-data:
  redis-data:
  minio-data:
